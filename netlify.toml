[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # SITE_URL is a public origin, not a credential. Its value legitimately appears
  # in generated content and source files, so omit only this key from secret scans.
  SECRETS_SCAN_OMIT_KEYS = "SITE_URL"

[dev]
  functions = "netlify/functions"
  framework = "next"
  publish = ".next"
  command = "next dev"
  targetPort = 3000

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
